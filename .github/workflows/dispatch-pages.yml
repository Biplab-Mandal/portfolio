name: Trigger GitHub Pages deployment

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pages-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PAGES_APP_PRIVATE_KEY }}
          owner: Biplab-Mandal
          repositories: Biplab-Mandal.github.io
          permission-contents: write

      - name: Dispatch Pages deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "Biplab-Mandal",
              repo: "Biplab-Mandal.github.io",
              event_type: "portfolio-master-updated",
              client_payload: {
                source_sha: context.sha,
                recovery_attempt: 0,
              },
            });
